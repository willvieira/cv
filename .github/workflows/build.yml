name: Build and deploy

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - master
    tags:
      - '*'

  schedule:
    - cron: '0 5 1,15 * *'


jobs:
  Build_deploy:
    # Pinned: ubuntu-26.04 (ubuntu-latest since Nov 2026) has a newer glibc that
    # breaks the source build of later 1.3.2 (tinycthread once_flag conflict).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '2.17.1'

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2.0'
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Render html
        run: Rscript -e "rmarkdown::render('index.Rmd')"
        env:
          ORCID_TOKEN: ${{ secrets.ORCID_TOKEN }}
          # Tag-triggered runs render footer links pointing at /<tag>/
          CV_APP_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      # Pinned to the same Chrome as the Dockerfile so runner image updates
      # don't change the browser under pagedown.
      - uses: browser-actions/setup-chrome@v1
        id: setup-chrome
        with:
          chrome-version: '155.0.8059.39'

      # pagedown only adds --no-sandbox on Windows; since runner image 20261116
      # Chrome exits at launch without it ("Cannot find headless Chrome").
      # pagedown.chrome.log keeps Chrome's stderr, printed below on failure.
      - name: Render pdf
        run: Rscript -e "options(pagedown.chrome.log = TRUE); pagedown::chrome_print(input = 'index.html', output = 'index.pdf', wait = 5, extra_args = c('--disable-gpu', '--no-sandbox'))"
        env:
          PAGEDOWN_CHROME: ${{ steps.setup-chrome.outputs.chrome-path }}

      - name: Show Chrome log
        if: failure()
        run: cat chrome-stderr-*.log || true

      - name: Prepare deployment
        run: |
          mkdir docs
          mv index.html docs/index.html
          mv index.pdf docs/WillianVieira.pdf

      # Tags deploy to a subfolder matching the tag name (e.g. tag "overstory" → /overstory/).
      # Master/schedule deploys to the root.
      - name: Set deploy target folder
        id: target
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "folder=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "folder=" >> $GITHUB_OUTPUT
          fi

      - name: Deploy gh_pages
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: docs
          TARGET_FOLDER: ${{ steps.target.outputs.folder }}
          CLEAN: false
          SINGLE_COMMIT: false

name: Build and deploy

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

on:
  push:
    branches:
      - master
    tags:
      - '*'

  schedule:
    - cron: '0 5 1,15 * *'


jobs:
  Build_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - uses: r-lib/actions/setup-pandoc@v2
        with:
          pandoc-version: '2.17.1'

      - name: Install R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.2.0'
          use-public-rspm: true

      - uses: r-lib/actions/setup-renv@v2
        with:
          cache-version: 1

      - name: Render html
        run: Rscript -e "rmarkdown::render('index.Rmd')"
        env:
          ORCID_TOKEN: ${{ secrets.ORCID_TOKEN }}
          # Tag-triggered runs render footer links pointing at /<tag>/
          CV_APP_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}

      - name: Render pdf
        run: Rscript -e "pagedown::chrome_print(input = 'index.html', output = 'index.pdf', wait = 5)"

      - name: Prepare deployment
        run: |
          mkdir docs
          mv index.html docs/index.html
          mv index.pdf docs/WillianVieira.pdf

      # Tags deploy to a subfolder matching the tag name (e.g. tag "overstory" → /overstory/).
      # Master/schedule deploys to the root.
      - name: Set deploy target folder
        id: target
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            echo "folder=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            echo "folder=" >> $GITHUB_OUTPUT
          fi

      - name: Deploy gh_pages
        uses: JamesIves/github-pages-deploy-action@releases/v3
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: gh-pages
          FOLDER: docs
          TARGET_FOLDER: ${{ steps.target.outputs.folder }}
          CLEAN: false
          SINGLE_COMMIT: false
